<!doctype html>
<html lang="en"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src https://heist-desk-live-default-rtdb.europe-west1.firebasedatabase.app wss://heist-desk-live-default-rtdb.europe-west1.firebasedatabase.app; base-uri 'none'; form-action 'none'"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">

<title>Heist Desk · live</title>
<style>
:root{--card:rgba(24,2,6,.58);--line:rgba(255,255,255,.12);--ink2:rgba(255,255,255,.72);--ink3:rgba(255,255,255,.5);--green:#34D27B;--red:#FF6B6B}
*{box-sizing:border-box}
html{background:#22040A}
body{margin:0;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
 background:linear-gradient(180deg,#C8141F 0%,#9E0E18 28%,#5E0910 62%,#22040A 100%) fixed;min-height:100vh;
 padding:calc(14px + env(safe-area-inset-top)) 14px calc(32px + env(safe-area-inset-bottom))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sb{justify-content:space-between}
.logo{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.92);color:#9E0E18;display:inline-flex;align-items:center;justify-content:center;font-weight:800}
.title{font-size:28px;font-weight:800;letter-spacing:-.5px}
.paper{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px}
.dot{width:8px;height:8px;border-radius:999px;background:#FBBF24;display:inline-block}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-size:12px;font-variant-numeric:tabular-nums}
.ldot{width:8px;height:8px;border-radius:999px;background:var(--green);box-shadow:0 0 0 0 rgba(52,210,123,.7)}
.ldot.on{animation:pulse 1s ease-out}
.ldot.stale{background:#FBBF24}.ldot.dead{background:var(--red)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,210,123,.7)}100%{box-shadow:0 0 0 10px rgba(52,210,123,0)}}
.ticker{overflow:hidden;white-space:nowrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.ticker .in{display:inline-flex;gap:26px;animation:scroll 30s linear infinite;padding-left:100%}
@keyframes scroll{to{transform:translateX(-100%)}}
.tk{display:inline-flex;align-items:center;gap:6px;font-size:14px}
.tkc{width:22px;height:22px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.eqlab{color:var(--ink2);font-size:15px}
.eq{font-weight:800;line-height:1;letter-spacing:-2px;font-size:clamp(64px,17vw,112px);font-variant-numeric:tabular-nums;transition:text-shadow .6s}
.eq .c{font-size:.42em;letter-spacing:0;color:var(--ink2)}
.eq.up{text-shadow:0 0 22px rgba(52,210,123,.85)}.eq.dn{text-shadow:0 0 22px rgba(255,107,107,.85)}
.pill{border-radius:10px;padding:5px 12px;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.mult{background:rgba(255,255,255,.92);color:#7A0A12;border-radius:12px;padding:4px 12px;font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;min-width:0}
h2{font-size:22px;font-weight:700;margin:0}
.head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.sub{color:var(--ink2);font-size:13px}.mut{color:var(--ink3);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.fr{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.fr:first-child{border-top:0}
.av{width:36px;height:36px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:0 0 auto}
.grow{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.good{background:rgba(52,210,123,.18);color:var(--green)}.bad{background:rgba(255,107,107,.2);color:var(--red)}
.info{background:rgba(96,165,250,.2);color:#93C5FD}.neu{background:rgba(255,255,255,.12);color:#fff}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:#fff;border-radius:999px;transition:width .8s ease}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--green)}.neg{color:var(--red)}
.goal{position:relative;height:54px;margin-top:6px}
.gl{position:absolute;left:0;right:0;top:14px;height:6px;border-radius:999px;background:rgba(255,255,255,.15)}
.gs{position:absolute;top:8px;transform:translateX(-50%);text-align:center}
.gs b{display:block;width:18px;height:18px;border-radius:999px;margin:0 auto;border:2px solid rgba(255,255,255,.4);background:#3A0A10}
.gs.hit b{background:var(--green);border-color:var(--green)}
.gcur{position:absolute;top:9px;transform:translateX(-50%);width:16px;height:16px;border-radius:999px;background:#3B82F6;border:3px solid #fff;box-shadow:0 0 0 6px rgba(59,130,246,.25);transition:left .8s ease}
.tabs{display:inline-flex;background:rgba(0,0,0,.35);border-radius:999px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px}
.tabs button.on{background:rgba(255,255,255,.9);color:#7A0A12}
svg{display:block;width:100%}
.foot{color:var(--ink3);font-size:12px;text-align:center;line-height:1.5}
</style></head>
<body><div class="wrap">
 <div class="row sb">
  <div class="row"><span class="logo">HD</span><span class="title">Heist Desk</span></div>
  <div class="row"><span class="live"><span id="ld" class="ldot"></span><span id="lt">connecting…</span></span><span class="paper"><span class="dot"></span>PAPER</span></div>
 </div>
 <div class="ticker"><div class="in" id="ticker"></div></div>
 <div class="row sb" style="align-items:flex-end">
  <div>
   <div class="eqlab" id="eqlab">Equity</div>
   <div class="eq" id="eq">€–</div>
   <div class="row" style="margin-top:10px"><span class="pill" id="pill"></span><span class="sub" id="stats"></span></div>
  </div>
  <div class="row" style="flex-direction:column;align-items:flex-end;gap:6px"><span class="mult" id="mult">–</span><span class="badge" id="real" style="background:rgba(0,0,0,.45)"></span></div>
 </div>
 <div class="card"><div class="head"><h2>Equity curve</h2><span class="sub" id="curvesub"></span></div><div id="curve"></div></div>
 <div class="card" id="goal"></div>
 <div class="grid">
  <div class="card"><div class="head"><h2>Funnel</h2><span class="sub" id="funsub"></span></div><div id="funnel"></div></div>
  <div class="card"><div class="head"><h2>Open positions</h2><span class="sub" id="opsub"></span></div><div id="open"></div></div>
 </div>
 <div class="grid">
  <div class="card"><div class="head"><h2>Desk log</h2><span class="sub">latest first</span></div><div id="events"></div></div>
  <div class="card"><div class="head"><h2>Why tokens got skipped</h2><span class="sub">today</span></div><div id="rej"></div></div>
 </div>
 <div class="grid">
  <div class="card"><div class="head"><h2>Standings</h2><span class="tabs"><button id="bt" class="on">Trades</button><button id="bs">Sources</button></span></div><div id="stand"></div></div>
  <div class="card"><div class="head"><h2>Activity</h2><span class="sub" id="actsub"></span></div><div id="act"></div></div>
 </div>
 <div class="foot" id="foot">Paper trading only · no real money · a few days of paper data prove nothing about profitability.</div>
</div>
<script>
"use strict";
const CREW={tokyo:["Tokyo","#3B82F6","T"],berlin:["Berlin","#F59E0B","B"],palermo:["Palermo","#F43F5E","P"],denver:["Denver","#A855F7","D"],rio:["Rio","#22C55E","R"],stockholm:["Stockholm","#06B6D4","S"],professor:["Professor","#EAB308","Pr"],helsinki:["Helsinki","#EC4899","H"],moscow:["Moscow","#94A3B8","M"],lisbon:["Lisbon","#14B8A6","L"],nairobi:["Nairobi","#F97316","N"],bogota:["Bogota","#84CC16","Bo"]};
const GOALS=[1.25,1.5,2,3,5];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"'`]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;","`":"&#96;"}[c]));
const crewOf=n=>{const c=CREW[n];return c?{label:c[0],color:c[1],letter:c[2]}:{label:n,color:"#94A3B8",letter:String(n).slice(0,1).toUpperCase()}};
const money=v=>(v>=0?"+":"−")+"€"+Math.abs(v).toFixed(2);
const pct=v=>(v>=0?"+":"−")+Math.abs(v).toFixed(1)+"%";
// ---- number tweening: any element with data-tw="key" data-v="number" data-f="fmt" animates from its previous value
const prev={},anims={};
const FMT={money,pct,int:v=>Math.round(v).toLocaleString("en-US"),x:v=>v.toFixed(2)+"x",usd:v=>"€"+v.toFixed(2)};
function tweenAll(root){root.querySelectorAll("[data-tw]").forEach(el=>{const k=el.dataset.tw,to=+el.dataset.v,f=FMT[el.dataset.f]||FMT.int;
  const from=k in prev?prev[k]:to;prev[k]=to;tween(el,k,from,to,f)})}
function tween(el,k,from,to,f,dur=700){cancelAnimationFrame(anims[k]);if(from===to||!isFinite(from)){el.textContent=f(to);return}
  const t0=performance.now();const step=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=f(from+(to-from)*e);if(p<1)anims[k]=requestAnimationFrame(step)};anims[k]=requestAnimationFrame(step)}
const tw=(k,v,f)=>`<span class="num" data-tw="${esc(k)}" data-v="${+v}" data-f="${f}">${esc(FMT[f](+v))}</span>`;
// ---- equity hero (custom tween for big dollars + small cents)
let eqPrev=null;
function setEq(v){const el=$("eq");const from=eqPrev??v;if(eqPrev!==null&&Math.abs(v-eqPrev)>=0.005){el.classList.remove("up","dn");void el.offsetWidth;el.classList.add(v>eqPrev?"up":"dn");setTimeout(()=>el.classList.remove("up","dn"),900)}
  eqPrev=v;cancelAnimationFrame(anims.eq);const t0=performance.now();
  const draw=x=>{const [w,c]=Math.max(0,x).toFixed(2).split(".");el.innerHTML="€"+esc(w)+'<span class="c">.'+esc(c)+"</span>"};
  const step=t=>{const p=Math.min(1,(t-t0)/800),e=1-Math.pow(1-p,3);draw(from+(v-from)*e);if(p<1)anims.eq=requestAnimationFrame(step)};anims.eq=requestAnimationFrame(step)}
function curve(pts,start){const W=1000,H=260,P=10;if(!pts.length)return"";const v=pts.map(p=>p.balance);
  let lo=Math.min(start,...v),hi=Math.max(start,...v);const pad=(hi-lo)*.12||1;lo-=pad;hi+=pad;
  const x=i=>pts.length<2?W:(i/(pts.length-1))*W,y=b=>P+(1-(b-lo)/(hi-lo))*(H-2*P);
  const d=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.balance).toFixed(1)).join(" ");
  const lx=x(pts.length-1),ly=y(v[v.length-1]);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:220px"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff" stop-opacity=".22"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  <line x1="0" x2="${W}" y1="${y(start)}" y2="${y(start)}" stroke="rgba(255,255,255,.45)" stroke-dasharray="6 6" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
  <path d="${d} L${W} ${H} L0 ${H} Z" fill="url(#g)"/><path d="${d}" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
  <div style="position:relative;height:0"><span style="position:absolute;left:calc(${lx/W*100}% - 7px);top:${-220+ly/H*220-7}px;width:14px;height:14px;border-radius:999px;background:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.2)"></span></div>
  <div class="row sb mut" style="margin-top:4px"><span>${esc(String(pts[0].time).slice(11,16))}</span><span>dashed = €${start.toFixed(0)} start</span><span>now</span></div>`}
function goal(m){const stops=[1,...GOALS];const pos=v=>{if(v<=1)return 0;for(let i=1;i<stops.length;i++)if(v<=stops[i])return((i-1)+(v-stops[i-1])/(stops[i]-stops[i-1]))/(stops.length-1);return 1};
  const next=GOALS.find(g=>g>m)??GOALS[GOALS.length-1];
  return `<div class="row sb"><span style="font-weight:700;font-size:18px">Goal: ${next}x</span><span class="sub">${tw("gm",m,"x")} now${m<1?" · below the €${(+last?.balance?.start_usd||100).toFixed(0)} start":""}</span></div>
  <div class="goal"><div class="gl"></div>${stops.map((s,i)=>`<div class="gs ${m>=s?"hit":""}" style="left:${i/(stops.length-1)*100}%"><b></b><div class="mut" style="font-size:11px;margin-top:4px">${s===1?"start":s+"x"}</div></div>`).join("")}
  <div class="gcur" style="left:${Math.max(0,Math.min(1,pos(m)))*100}%"></div></div>`}
let standView="trade",last=null;
$("bt").onclick=()=>{standView="trade";$("bt").className="on";$("bs").className="";last&&render(last)};
$("bs").onclick=()=>{standView="source";$("bs").className="on";$("bt").className="";last&&render(last)};
function render(D){last=D;const b=D.balance,eq=+b.equity_usd,start=+b.start_usd,diff=eq-start,m=eq/start;
  $("ticker").innerHTML=[...(D.ticker||[]),{symbol:"SOL",kind:"mkt",chg_pct:D.market?.sol_24h_pct??0,basis:"24h €"+(+D.market?.sol_usd||0).toFixed(2)}].map(t=>`<span class="tk"><span class="tkc" style="background:${t.kind==="held"?"#F59E0B":"rgba(255,255,255,.22)"}">${esc(String(t.symbol).slice(0,1))}</span><b>${esc(t.symbol)}</b><span class="${t.chg_pct>=0?"pos":"neg"} num">${esc(pct(+t.chg_pct||0))}</span><span class="mut">${esc(t.kind==="held"?"held":t.kind==="mkt"?"market":"watch")} · ${esc(t.basis)}</span></span>`).join("");
  $("eqlab").textContent="Equity · €"+start.toFixed(0)+" paper base";setEq(eq);
  const pill=$("pill");pill.style.background=diff>=0?"rgba(20,120,60,.85)":"rgba(60,0,8,.75)";pill.style.color=diff>=0?"#B7F7D0":"#FFB3B3";
  pill.innerHTML=tw("diff",diff,"money")+" · "+tw("diffp",diff/start*100,"pct");tweenAll(pill);
  $("stats").textContent=`${D.closed_count} closed · ${D.win_rate_pct??0}% win · ${D.today?.entered??0} entered today · ${D.trade_rate?.last_1h??0} trades last 1h (${D.trade_rate?.per_hour_today??0}/h today, target ${D.trade_rate?.target_per_day??25}/day)`;
  $("mult").innerHTML=tw("mult",m,"x");tweenAll($("mult"));
  const r=$("real");r.style.color=+b.realized_usd>=0?"var(--green)":"var(--red)";r.textContent="realized "+money(+b.realized_usd);
  $("curvesub").textContent=`max drawdown €${(+D.drawdown?.max_usd||0).toFixed(2)} · exposure ${D.exposure?.pct_of_equity??0}%`;
  $("curve").innerHTML=curve(D.equity_curve||[],start);
  $("goal").innerHTML=goal(m);tweenAll($("goal"));
  const fun=D.crew_funnel||[];$("funsub").textContent=`${(+D.today?.scanned||0).toLocaleString("en-US")} scanned · ${D.today?.entered??0} entered`;
  $("funnel").innerHTML=fun.map(f=>{const c=crewOf(f.name),l=f.latest;return `<div class="fr"><span class="av" style="background:${c.color}">${esc(c.letter)}</span>
   <div class="grow"><div style="font-weight:700">${esc(c.label)} <span class="mut" style="font-weight:400">${esc(f.role)}</span></div>
   <div class="mut ell">${l?`${esc(l.symbol)} · ${esc(l.verdict)} · ${esc(l.reason)} · ${esc(l.at)}`:esc(f.info||"")}</div></div>
   <span class="badge ${f.kind==="good"?"good":f.kind==="bad"?"bad":"info"}">${f.count==null?esc(f.count_label):tw("f_"+f.name,f.count,"int")+" "+esc(f.count_label)}</span></div>`}).join("");tweenAll($("funnel"));
  const op=D.open_positions||[];$("opsub").textContent=op.length?`marks: ${D.live?.marks==="live"?"live every "+D.live.mark_every_s+" s":"Helsinki ~75 s"}`:"flat";
  $("open").innerHTML=op.length?op.map(p=>`<div class="fr"><span class="av" style="background:#F59E0B">${esc(String(p.symbol).slice(0,1))}</span><div class="grow"><div style="font-weight:700">${esc(p.symbol)}</div>
   <div class="mut ell">${esc(p.signal_source)} · ${esc(p.age_min)} min · mark ${esc(p.mark_age_s)} s old (${esc(p.mark_source)})</div></div>
   <div style="text-align:right"><div class="${p.pnl_pct>=0?"pos":"neg"}" style="font-weight:700">${tw("op_"+p.mint,p.pnl_pct,"pct")}</div><div class="mut">${tw("ov_"+p.mint,p.value_usd,"usd")} / €${(+p.cost_left_usd).toFixed(2)}</div></div></div>`).join(""):`<div class="mut">No open positions right now.</div>`;tweenAll($("open"));
  $("events").innerHTML=(D.events||[]).slice(0,10).map(e=>{const c=crewOf(e.who);return `<div class="fr"><span class="av" style="background:${c.color};width:28px;height:28px;font-size:12px;border-radius:9px">${esc(c.letter)}</span><div class="grow ell"><b>${esc(e.symbol)}</b> <span class="sub">${esc(e.text)}</span></div><span class="mut num">${esc(e.at)}</span></div>`}).join("")||'<div class="mut">Quiet.</div>';
  const rej=D.rejections_top8||[],rm=Math.max(1,...rej.map(x=>x.count));
  $("rej").innerHTML=rej.map((x,i)=>`<div style="padding:6px 0"><div class="row sb"><span class="ell" style="max-width:78%">${esc(x.label)} <span class="mut">${esc(crewOf(x.reason.split(":")[0]).label)}</span></span>${tw("r"+i,x.count,"int")}</div><div class="bar"><i style="width:${x.count/rm*100}%"></i></div></div>`).join("");tweenAll($("rej"));
  const st=D.standings||[];let rows;
  if(standView==="trade")rows=st.map((s,i)=>`<div class="fr"><span class="mut num" style="width:20px">${i+1}</span><div class="grow"><b>${esc(s.symbol)}</b> <span class="mut">${esc(s.source)}${s.open?" · open":""}</span></div><span class="${s.pnl_usd>=0?"pos":"neg"}" style="font-weight:700">${tw("s_"+s.symbol,s.pnl_usd,"money")}</span></div>`);
  else{const a={};st.forEach(s=>{const k=s.source||"unknown";a[k]=a[k]||{source:k,pnl:0,w:0,l:0,open:0};a[k].pnl+=s.pnl_usd;if(s.open)a[k].open++;else if(s.pnl_usd>0)a[k].w++;else a[k].l++});
   rows=Object.values(a).sort((x,y)=>y.pnl-x.pnl).map(s=>`<div class="fr"><div class="grow"><b>${esc(s.source)}</b> <span class="mut">${s.w}W ${s.l}L${s.open?" · "+s.open+" open":""}</span></div><span class="${s.pnl>=0?"pos":"neg"}" style="font-weight:700">${tw("ss_"+s.source,s.pnl,"money")}</span></div>`)}
  $("stand").innerHTML=rows.join("")||'<div class="mut">No trades yet.</div>';tweenAll($("stand"));
  const A=D.activity||{labels:[],series:{}},names=Object.keys(A.series),L=A.labels.length,tot=A.labels.map((_,i)=>names.reduce((s,n)=>s+(A.series[n][i]||0),0)),tm=Math.max(1,...tot);
  $("actsub").textContent=`per ${A.bucket_min} min`;
  const W=1000,H=200,bw=W/Math.max(1,L);let svg=`<svg viewBox="0 0 ${W} ${H+20}" style="height:200px">`;
  A.labels.forEach((lab,i)=>{let y=H;names.forEach(n=>{const v=A.series[n][i]||0,h=v/tm*(H-24);if(h>0){y-=h;svg+=`<rect x="${i*bw+bw*.15}" y="${y}" width="${bw*.7}" height="${h}" fill="${crewOf(n).color}" rx="3"/>`}});
   svg+=`<text x="${i*bw+bw/2}" y="${y-5}" text-anchor="middle" font-size="22" fill="rgba(255,255,255,.72)">${tot[i]}</text><text x="${i*bw+bw/2}" y="${H+18}" text-anchor="middle" font-size="22" fill="rgba(255,255,255,.5)">${esc(lab)}</text>`});
  $("act").innerHTML=svg+"</svg>"+`<div class="row" style="margin-top:6px">${names.map(n=>`<span class="mut row" style="gap:4px"><span style="width:10px;height:10px;border-radius:3px;background:${crewOf(n).color}"></span>${esc(crewOf(n).label)}</span>`).join("")}</div>`;
  const ok=(D.crew||[]).filter(c=>c.status==="ok").length;
  $("foot").innerHTML=`${ok}/${(D.crew||[]).length} crew healthy · regime ${esc(D.market?.regime)} · live mode ${D.live_mode?"ON?!":"OFF"}<br>Paper trading only · no real money · a few days of paper data prove nothing about profitability.`}
// ---- Firebase RTDB stream (EventSource), polling fallback. Token comes from the URL #fragment only.
const DB="https://heist-desk-live-default-rtdb.europe-west1.firebasedatabase.app",TOK=(location.hash.slice(1).match(/^[0-9a-f]{32}$/)||[""])[0];let S={},lastOk=0,es=null,pollT=null,dirty=false;
function setAt(path,val){const p=path.split("/").filter(Boolean);if(p[0]!=="k"){if(!p.length&&val&&typeof val==="object")S=Object.assign({},val.k||{});else if(!p.length)S={};return}
  if(p.length===1){S=Object.assign({},val||{})}else{const k=p[1];if(val==null)delete S[k];else S[k]=val}}
function patchAt(path,obj){const p=path.split("/").filter(Boolean);for(const[k,v]of Object.entries(obj||{})){setAt("/"+p.concat(k).join("/"),v)}}
function flush(){if(!dirty)return;dirty=false;const D={};for(const[k,v]of Object.entries(S)){try{D[k]=JSON.parse(v)}catch(e){}}
  if(!D.balance)return;D.equity_curve=(D.equity_curve||[]).concat(D.live&&D.live.point?[D.live.point]:[]);D.generated_at=D.live&&D.live.generated_at;
  try{render(D)}catch(e){console.error(e)}lastOk=Date.now();const ld=$("ld");ld.className="ldot";void ld.offsetWidth;ld.className="ldot on";
  $("lt").textContent="live · "+String(D.live&&D.live.server_time||"").slice(11,19)+" CET"}
const URLK=DB+"/live/"+TOK+"/k.json";
function stream(){if(es)es.close();es=new EventSource(URLK);
  es.addEventListener("put",e=>{const m=JSON.parse(e.data);setAt("/k"+(m.path==="/"?"":m.path),m.data);dirty=true});
  es.addEventListener("patch",e=>{const m=JSON.parse(e.data);patchAt("/k"+(m.path==="/"?"":m.path),m.data);dirty=true});
  es.addEventListener("keep-alive",()=>{});
  es.addEventListener("cancel",()=>{es.close();es=null;$("lt").textContent="access denied — check the link"});
  es.onerror=()=>{if(!pollT)pollT=setInterval(poll,3000)}}
async function poll(){if(document.hidden)return;try{const r=await fetch(URLK,{cache:"no-store"});if(!r.ok)throw 0;S=Object.assign({},await r.json()||{});dirty=true;
  if(es&&es.readyState===1&&pollT){clearInterval(pollT);pollT=null}}catch(e){}}
setInterval(flush,250);
setInterval(()=>{const age=(Date.now()-lastOk)/1000;if(lastOk&&age>5){$("ld").className="ldot "+(age>30?"dead":"stale");$("lt").textContent=`no update for ${Math.round(age)} s`}},1000);
if(!TOK){$("lt").textContent="missing #token in link"}else{stream();poll()}
</script></body></html>
